pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = '8dmusic-kt'
include ':core', ':app', ':provider-sdk'

gradle.projectsLoaded {
    gradle.rootProject.allprojects { project ->
        project.layout.buildDirectory.value(rootProject.layout.projectDirectory.dir('build'))
    }
}
