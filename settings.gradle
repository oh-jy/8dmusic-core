pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = '8dmusic-core'
include ':core', ':app'

gradle.projectsLoaded {
    gradle.rootProject.allprojects { project ->
        project.layout.buildDirectory.value(rootProject.layout.projectDirectory.dir('build'))
    }
}
